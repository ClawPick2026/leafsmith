name: Frontend targets

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/*.test.ts'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run web:build
