name: Manual native Windows GUI acceptance

# This lane tests the published checksum-pinned RC, not a rebuilt checkout,
# browser preview, --worker-self-test, or direct worker operation suite.
# It needs a real interactive desktop; unavailable UIA/Session 0 is a FAILURE.
# Silent NSIS install/uninstall are explicitly separate evidence phases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  published-rc-native-gui:
    if: github.repository == 'ClawPick2026/leafsmith' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PIP_NO_CACHE_DIR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Guard disposable hosted Windows before dependency or installer writes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows -or $env:GITHUB_ACTIONS -cne 'true' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:GITHUB_REPOSITORY -cne 'ClawPick2026/leafsmith' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:ImageOS -cne 'win22') {
            throw 'Refusing non-manual/non-hosted/non-Windows-2022 execution.'
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install CI-only automation dependencies (not an end-user requirement)
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/leafsmith-gui-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/leafsmith-gui-venv/Scripts/python.exe" -m pip install --disable-pip-version-check --no-cache-dir pywinauto==0.6.9 pywin32==311 comtypes==1.4.13 six==1.17.0 Pillow==11.3.0 pypdf==6.1.1
          exit $LASTEXITCODE
      - name: Portable unit tests — NOT native GUI evidence
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/leafsmith-gui-venv/Scripts/python.exe" -m unittest discover -s scripts/tests -p test_windows_gui.py -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-gui-unit.log"
          $status = $LASTEXITCODE
          exit $status
      - name: Actual installed app GUI, system picker/save, disk readback, close and uninstall
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/leafsmith-gui-venv/Scripts/python.exe" scripts/smoke_windows_gui.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-gui-command.log"
          $status = $LASTEXITCODE
          "Native acceptance process exit status: $status" | Add-Content "$env:RUNNER_TEMP/windows-gui-command.log"
          exit $status
      - name: Preserve synthetic native GUI evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-gui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leafsmith-windows-gui-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
            ${{ runner.temp }}/windows-gui-unit.log
            ${{ runner.temp }}/windows-gui-command.log
          if-no-files-found: error
          retention-days: 7
