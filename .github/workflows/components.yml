name: Optional engine packs

# Deliberately opt-in: no model downloads, no releases and no registry edits.
on:
  workflow_dispatch:
    inputs:
      component:
        description: Engine to build (all builds every supported pack)
        type: choice
        required: true
        default: all
        options: [all, ffmpeg, tesseract, libreoffice]

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -W error::ResourceWarning -m unittest discover -s scripts/tests -p test_components.py -v

  linux:
    needs: contract-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        component: [ffmpeg, tesseract, libreoffice]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.component == 'all' || inputs.component == matrix.component
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.component == 'all' || inputs.component == matrix.component
        with:
          python-version: '3.12'
      - name: Prepare disposable runner (never end-user installation)
        if: inputs.component == 'all' || inputs.component == matrix.component
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential nasm pkg-config fonts-dejavu-core ca-certificates
          python -m pip install Pillow==11.3.0
      - name: Build, audit and smoke the relocated ZIP
        if: inputs.component == 'all' || inputs.component == matrix.component
        env:
          COMPONENT: ${{ matrix.component }}
        run: python scripts/build_component.py --component "$COMPONENT" --platform linux-x86_64
      - name: Preserve binary, actual checksum, notices and corresponding source
        if: success() && (inputs.component == 'all' || inputs.component == matrix.component)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-${{ matrix.component }}-linux-x86_64
          path: dist/components/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-ffmpeg:
    if: inputs.component == 'all' || inputs.component == 'ffmpeg'
    needs: contract-tests
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            perl
            nasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf
      - name: Build LGPL-only FFmpeg and smoke native Windows VP9/Opus
        shell: msys2 {0}
        run: python scripts/build_component.py --component ffmpeg --platform windows-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-ffmpeg-windows-x86_64
          path: dist/components/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-ocr-office:
    # Independent of FFmpeg/Linux: an optional engine failure cannot cancel those jobs.
    needs: contract-tests
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        component: [tesseract, libreoffice]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.component == 'all' || inputs.component == matrix.component
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.component == 'all' || inputs.component == matrix.component
        with:
          python-version: '3.12'
      - name: Prepare disposable native runner (not an end-user requirement)
        if: inputs.component == 'all' || inputs.component == matrix.component
        run: python -m pip install cmake==3.31.6 Pillow==11.3.0
      - name: Native x64 build/extract, provenance audit, relocated conversion smoke
        if: inputs.component == 'all' || inputs.component == matrix.component
        env:
          COMPONENT: ${{ matrix.component }}
        run: python scripts/build_component.py --component "$env:COMPONENT" --platform windows-x86_64
      - name: Preserve engine ZIP, full notices, exact corresponding sources and smoke record
        if: success() && (inputs.component == 'all' || inputs.component == matrix.component)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-${{ matrix.component }}-windows-x86_64
          path: dist/components/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
