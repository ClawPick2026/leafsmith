name: Desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Branch pushes and manual runs build artifacts only. A v* tag additionally
# publishes a GitHub release, only after both platform packages pass; the
# publish job alone can write releases.
permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: appimage
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            bundle: nsis
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: worker/runtime-requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/native-security
      - name: Create evidence directory and record toolchains
        run: |
          mkdir -p build/logs
          set -o pipefail
          { python --version; node --version; npm --version; rustc --version; cargo --version; } 2>&1 | tee build/logs/toolchains.log
      - name: Enable corresponding-source indexes (disposable hosted Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          # Never run apt reconfiguration on a developer/self-hosted machine.
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_CODENAME" = jammy
          printf '%s\n' \
            'deb-src http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse' \
            'deb-src http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse' \
            'deb-src http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/paperwork-ci-deb-src.list
          sudo apt-get update
      - name: Linux native build and headless smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils curl wget file patchelf libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev xvfb xauth
      - name: Drop the GPL-only TIFF image loader (disposable hosted Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          # gdk-pixbuf's TIFF loader links libtiff -> libjbig (JBIG-KIT, GPL-2+).
          # The app never loads TIFF through GTK (the worker uses Pillow's own
          # libtiff), so the loader is neither inventoried nor bundled. The
          # postbundle audit rejects libjbig if anything still ships it.
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          pixbuf=/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0
          sudo rm -f "$pixbuf"/2.10.0/loaders/libpixbufloader-tiff.so
          sudo "$pixbuf"/gdk-pixbuf-query-loaders --update-cache
          if grep -q -i tiff "$pixbuf"/2.10.0/loaders.cache; then
            echo "::error::TIFF pixbuf loader is still registered"; exit 1
          fi
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend tests and build
        run: |
          set -o pipefail
          npm test 2>&1 | tee build/logs/frontend-tests.log
          npm run build 2>&1 | tee build/logs/frontend-build.log
      - name: Native security crate tests
        run: |
          set -o pipefail
          cargo test --manifest-path crates/native-security/Cargo.toml 2>&1 | tee build/logs/security-tests.log
      - name: Install core worker and packaging tools (no models)
        run: |
          python -m pip install --only-binary=:all: -r worker/runtime-requirements.txt pyinstaller==6.22.3 pytest==9.1.1
          python -m pip freeze > build/logs/python-environment.txt
      - name: Worker and package regression tests
        run: |
          set -o pipefail
          # These two fixtures execute Unix shebang files, not Windows .exe files.
          # Exercise them on Linux; do not misreport a Windows PE launch failure.
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            extra+=(--deselect=worker/tests/test_pdf_ops.py::test_office_engine_receives_locked_down_job_profile --deselect=worker/tests/test_pdf_ops.py::test_subprocess_timeout_sanitized)
            printf '%s\n' 'Windows excludes two POSIX-only probe fixtures; Linux runs both.' | tee build/logs/platform-test-scope.txt
          fi
          python -m pytest worker/tests scripts/tests/test_freeze.py scripts/tests/test_linux_licenses.py scripts/tests/test_frozen_pptx.py scripts/tests/test_packaged_operations.py -v "${extra[@]}" --junitxml=build/logs/python-tests.xml 2>&1 | tee build/logs/python-tests.log
      - name: Freeze embedded Python worker and verify PDF form roundtrip
        run: |
          set -o pipefail
          python scripts/freeze-worker.py 2>&1 | tee build/logs/freeze.log
      - name: Native application crate tests (resources now exist)
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }} 2>&1 | tee build/logs/native-tests.log
      - name: Build Linux native executable for prebundle dependency inventory
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }} 2>&1 | tee build/logs/native-prebundle-build.log
      - name: Collect actual Python, PDFium, font, npm, Rust and Linux dependency notices/sources
        run: |
          set -o pipefail
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            extra+=(--linux-native "src-tauri/target/${{ matrix.rust_target }}/release/paperwork-desktop")
            # Explicit dlopen loader roots: inventory a superset before bundling;
            # the postbundle audit still checks what Tauri actually shipped.
            extra+=(--linux-extra-library '/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/*/loaders/*.so')
            extra+=(--linux-extra-library '/usr/lib/x86_64-linux-gnu/gtk-3.0/*/immodules/*.so')
            extra+=(--linux-extra-library '/usr/lib/x86_64-linux-gnu/gio/modules/*.so')
          fi
          python scripts/license-report.py --require-rust "${extra[@]}" 2>&1 | tee build/logs/licenses.log
      - name: Verify frozen worker and license resources without Python on PATH
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then worker=build/worker/paperwork-worker/paperwork-worker.exe; else worker=build/worker/paperwork-worker/paperwork-worker; fi
          python scripts/smoke-package.py --kind worker --path "$worker" --logs build/logs/frozen-smoke
      - name: Build native package
        env:
          # AppImage extraction does not require FUSE on newer hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -o pipefail
          npm run tauri -- build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle }} 2>&1 | tee build/logs/package-build.log
      - name: Smoke fresh silent NSIS payload (not interactive desktop validation)
        if: runner.os == 'Windows'
        run: python scripts/smoke-package.py --kind nsis --path 'src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe' --logs build/logs/nsis-smoke
      - name: Smoke extracted AppImage through native resource lookup
        if: runner.os == 'Linux'
        run: python scripts/smoke-package.py --kind appimage --path 'src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage' --logs build/logs/appimage-smoke
      - name: Audit actual extracted Linux libraries and verify corresponding-source ZIP
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          python scripts/audit_linux_libraries.py \
            --appimage 'src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage' \
            --inventory build/worker/paperwork-worker/third-party-licenses/linux-libraries.json \
            --sources build/linux-corresponding-sources \
            --source-archive artifacts/Paperwork-linux-corresponding-sources.zip \
            --logs build/logs/linux-library-audit 2>&1 | tee build/logs/linux-library-audit.log
      - name: Collect verified package, notices and SHA-256
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil
          out = Path('artifacts')
          out.mkdir(exist_ok=True)
          bundle = '${{ matrix.bundle }}'
          base = Path('src-tauri/target/${{ matrix.rust_target }}/release/bundle') / bundle
          files = list(base.glob('*.exe' if bundle == 'nsis' else '*.AppImage'))
          assert len(files) == 1, files
          for path in files:
              shutil.copyfile(path, out / path.name)
          # The same notices ship inside the package; this copy is readable before installing.
          notices = Path('build/worker/paperwork-worker/third-party-licenses')
          assert (notices / 'manifest.json').is_file(), 'Missing packaged notice manifest'
          shutil.make_archive(str(out / 'Paperwork-${{ matrix.target }}-third-party-notices'), 'zip', notices)
          sources = list(out.glob('*-corresponding-sources.zip'))
          assert bundle != 'appimage' or len(sources) == 1, 'Missing verified Linux source ZIP'
          release = [out / p.name for p in files] + sorted(out.glob('*-third-party-notices.zip')) + sources
          sums = []
          for path in release:
              with path.open('rb') as stream:
                  sums.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + path.name)
          (out / 'SHA256SUMS-${{ matrix.target }}.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
      - name: Upload verified standalone package
        uses: actions/upload-artifact@v4
        with:
          name: Paperwork-${{ matrix.target }}
          path: artifacts/
          compression-level: 0  # AppImage/source tarballs are already compressed.
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke, tests, build logs and actual license resources even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paperwork-evidence-${{ matrix.target }}
          path: |
            build/logs/
            build/linux-corresponding-sources/*/download.log
            build/linux-corresponding-sources/source-inventory.json
            build/worker/paperwork-worker/third-party-licenses/
            build/pyinstaller/paperwork-worker/warn-paperwork-worker.txt
            src-tauri/Cargo.lock
            crates/native-security/Cargo.lock
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag, app version and release notes
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"; exit 1 ;;
          esac
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$notes" || { echo "::error::Missing release notes $notes"; exit 1; }
          head -n 1 "$notes" | grep -q '^# ' || { echo "::error::$notes must start with a '# ' title"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: Paperwork-linux-x86_64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Paperwork-windows-x86_64
          path: release
      - name: Verify downloaded assets against both checksum lists
        working-directory: release
        run: |
          ls -l
          sha256sum --strict -c SHA256SUMS-linux-x86_64.txt SHA256SUMS-windows-x86_64.txt
          test "$(ls | wc -l)" -eq "$(cat SHA256SUMS-*.txt | wc -l | awk '{print $1 + 2}')"
      - name: Create release (draft until every asset is uploaded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          title=$(head -n 1 "$notes" | sed 's/^# //')
          tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
          printf '\nBuilt from commit `%s` by [workflow run %s](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/notes.md"
          flags=(--draft --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" release/* "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
